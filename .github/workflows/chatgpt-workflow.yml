name: ChatGPT workflow checks

on:
  pull_request:
    paths:
      - 'src/chatgpt_web.py'
      - 'src/browser.py'
      - 'src/config.py'
      - 'src/pipeline.py'
      - 'tests/test_chatgpt_workflow.py'
      - 'requirements.txt'
      - '.github/workflows/chatgpt-workflow.yml'
  workflow_dispatch:

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Compile modified modules
        run: python -m py_compile src/chatgpt_web.py src/browser.py src/pipeline.py src/config.py
      - name: Test ChatGPT validation
        run: python -m unittest tests/test_chatgpt_workflow.py -v
