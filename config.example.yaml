# ---------------------------------------------------------------- ChatGPT
# Custom GPT image generation (GPT-4o + DALL-E 3)
# Uses persistent Chrome profile for login session persistence
chatgpt:
  enabled: true
  # Specific conversation URL for image generation
  url: "https://chatgpt.com/g/g-p-6aeafd8cf6148191b9034dbaaf247ba1/project"
  # Chrome profile for persistent login - use existing logged-in profile
  use_own_chrome_profile: true
  chrome_profile_name: "Profile 4"  # Profile 4 in Chrome User Data folder (easysell.gpt@gmail.com)
  chrome_channel: "chrome"
  chrome_executable_path: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"  # Full path to Chrome executable
  user_data_dir: ".browser-profile-chatgpt"
  chrome_user_data_dir: "C:\\Users\\Admin\\AppData\\Local\\Google\\Chrome\\User Data"  # Full path to Chrome User Data
  recopy_chrome_profile: false
  max_reference_images: 10
  upload_wait_sec: 10
  upload_timeout_sec: 30
  generation_timeout_sec: 300
  block_wait_sec: 120
  # CSS selectors (update when ChatGPT UI changes)
  selectors:
    prompt_box: 'div[contenteditable="true"][data-testid="prompt-textarea"]'
    send_button: 'button[data-testid="send-button"]'
    attach_buttons:
      - 'button[aria-label*="Attach" i]'
      - 'button[aria-label*="Upload" i]'
      - '[data-testid*="attachment" i]'
    upload_menu_items:
      - 'text="Upload from computer"'
      - 'text="Upload file"'
      - '[role="menuitem"]:has-text("Upload")'
    download_button: 'button[aria-label="Download"]'
    file_input: 'input[type="file"]'
    lightbox_close: 'button[aria-label*="Close" i]'
    consent_buttons:
      - 'button:has-text("Accept")'
      - 'button:has-text("Allow")'
    lightbox_backdrop: '.modal-backdrop, [data-testid="modal-backdrop"]'